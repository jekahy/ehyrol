<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow accents -->
  <circle cx="1100" cy="100" r="300" fill="#1e3a8a" opacity="0.25" filter="blur(80px)"/>
  <circle cx="100" cy="550" r="250" fill="#312e81" opacity="0.2" filter="blur(70px)"/>

  <!-- Content Container -->
  <g transform="translate(100, 110)">
    <!-- Monogram Avatar -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#badge-grad)"/>
    <text x="40" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">EH</text>

    <!-- Location & Status Badge -->
    <rect x="100" y="22" width="460" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="40" r="5" fill="#10b981"/>
    <text x="135" y="45" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Warsaw, Poland · Available for Senior iOS Roles</text>

    <!-- Name & Title -->
    <text x="0" y="160" font-family="-apple-system, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Eugene Hyrol</text>
    <text x="0" y="215" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="600" fill="#60a5fa">Senior iOS Engineer &amp; Technical Lead</text>

    <!-- Value proposition description -->
    <text x="0" y="275" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">9+ years building high-scale, secure mobile banking and e-commerce apps.</text>
    <text x="0" y="310" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Specializing in SwiftUI, Modular Architecture, OWASP Mobile Security &amp; Team Leadership.</text>

    <!-- Skills Badges -->
    <g transform="translate(0, 350)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="100" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="23" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">SwiftUI</text>

      <!-- Badge 2 -->
      <rect x="115" y="0" width="80" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="155" y="23" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Swift</text>

      <!-- Badge 3 -->
      <rect x="210" y="0" width="200" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="310" y="23" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Modular Architecture</text>

      <!-- Badge 4 -->
      <rect x="425" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="505" y="23" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Mobile Banking</text>

      <!-- Badge 5 -->
      <rect x="600" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="680" y="23" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">OWASP Security</text>
    </g>

    <!-- Footer URL -->
    <text x="0" y="445" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#3b82f6">eugene.hyrol.net</text>
  </g>
</svg>
